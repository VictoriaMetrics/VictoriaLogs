version: "3"

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-mc:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "mc alias set local http://minio:9000 minioadmin minioadmin &&
       mc rb --force local/loki || true &&
       mc mb local/loki &&
       mc anonymous set none local/loki &&
       sleep 1"
  generator:
    image: golang:1.25.0-alpine
    restart: always
    working_dir: /go/src/app
    volumes:
      - ./generator:/go/src/app
      - ./source_logs:/go/src/source_logs
    command:
      - go
      - run
      - main.go
      - -logsPath=/go/src/source_logs/logs
      - -outputRateLimitItems=10000
      - -outputRateLimitPeriod=1s
      - -syslog.addr=rsyslog:514
      - -syslog.addr2=rsyslog:514
      - -logs.randomSuffix=false
      - -logs.backdate.enable=true
      - -logs.backdate.days=7
    depends_on: [rsyslog]

  loki:
    image: grafana/loki:3.5.0
    user: 0:0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml -config.expand-env=true
    volumes:
      - loki:/tmp/loki
      - ./loki/:/etc/loki/
    environment:
      - LOKI_S3_BUCKET=loki
      - LOKI_S3_ENDPOINT=http://minio:9000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    depends_on:
      - minio
      - minio-mc

  promtail:
    image: grafana/promtail:3.1.0
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./loki/:/etc/promtail/
    depends_on:
      - loki
      - vlogs

  rsyslog:
    build:
      dockerfile: Dockerfile
      context: rsyslog
    volumes:
      - ./rsyslog/rsyslog.conf:/etc/rsyslog.conf
    depends_on: [promtail]

volumes:
  loki:
  minio-data:
